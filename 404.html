<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Page Not Found, Events by Luwa</title>
<link rel="icon" href="brand/logo.png">
<link rel="apple-touch-icon" href="brand/logo.png">
<meta name="theme-color" content="#FBF6EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Jost:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1815;--ink-soft:#4A4541;--teal:#0E7D6F;--teal-deep:#0A5C52;
  --wine:#7C2340;--wine-deep:#5E1830;--gold:#B99356;--ivory:#FBF6EE;
}
*{box-sizing:border-box;margin:0;}
body{
  font-family:'Jost',sans-serif;background:var(--ivory);color:var(--ink);
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;
}
.orb{position:absolute;border-radius:50%;filter:blur(50px);pointer-events:none;}
.o1{width:260px;height:260px;background:rgba(14,125,111,.18);top:8%;left:-60px;}
.o2{width:220px;height:220px;background:rgba(124,35,64,.15);bottom:6%;right:-40px;}
.wrap{position:relative;max-width:520px;}
.logo{width:148px;height:auto;margin:0 auto 26px;display:block;}
.bird{width:44px;height:44px;color:var(--teal);margin:0 auto 8px;display:block;}
.code{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(4rem,14vw,7rem);line-height:1;color:var(--wine);letter-spacing:-0.02em;}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(1.5rem,4vw,2rem);margin:6px 0 2px;}
.script{font-family:'Mrs Saint Delafield',cursive;font-size:1.9rem;color:var(--wine);}
p{color:var(--ink-soft);margin:14px auto 28px;max-width:42ch;line-height:1.6;}
.ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:600;font-size:.92rem;border:1px solid transparent;transition:transform .25s ease, background .25s ease, border-color .25s ease;}
.btn-primary{background:var(--wine);color:#fff;box-shadow:0 10px 24px -12px rgba(124,35,64,.55);}
.btn-primary:hover{background:var(--wine-deep);transform:translateY(-2px);}
.btn-out{border-color:rgba(27,24,21,.28);color:var(--ink);}
.btn-out:hover{border-color:var(--ink);background:rgba(27,24,21,.04);}
.thread{width:70px;height:2px;margin:28px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:3px;border-radius:6px;}
</style>
</head>
<body>
<span class="orb o1" aria-hidden="true"></span>
<span class="orb o2" aria-hidden="true"></span>
<div class="wrap">
  <img class="logo" src="brand/logo.png" alt="Events by Luwa">
  <svg class="bird" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 13c3-3.4 5.3-4.4 7-3.2.4.3.7.7 1 1.2.3-.5.6-.9 1-1.2 1.7-1.2 4-.2 7 3.2-2.4-1.1-4.2-1.4-5.5-1-1 .3-1.8 1-2.5 2-.7-1-1.5-1.7-2.5-2-1.3-.4-3.1-.1-5.5 1Z"/></svg>
  <div class="code">404</div>
  <h1>This page has wandered off</h1>
  <p class="script">but your celebration hasn’t</p>
  <p>The page you’re looking for isn’t here. Let’s get you back to planning something beautiful.</p>
  <div class="ctas">
    <a class="btn btn-primary" href="/eventsbyluwa/">Return Home</a>
    <a class="btn btn-out" href="https://wa.me/447823683189" target="_blank" rel="noopener">Chat on WhatsApp</a>
  </div>
  <div class="thread"></div>
</div>
</body>
</html>
